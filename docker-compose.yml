version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: reserveiq-postgres
    environment:
      POSTGRES_USER: reserveiq
      POSTGRES_PASSWORD: reserveiq
      POSTGRES_DB: reserveiq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reserveiq"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
