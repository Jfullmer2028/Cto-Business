name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-build:
    name: Lint, Type-Check, Prisma Validate & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reserveiq
          POSTGRES_PASSWORD: reserveiq_test
          POSTGRES_DB: reserveiq_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type-check
        run: npm run type-check

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Prisma migrations (test DB)
        env:
          DATABASE_URL: postgresql://reserveiq:reserveiq_test@localhost:5432/reserveiq_test
        run: npx prisma migrate deploy

      - name: Build application
        env:
          DATABASE_URL: postgresql://reserveiq:reserveiq_test@localhost:5432/reserveiq_test
          REDIS_URL: redis://localhost:6379
          NEXTAUTH_SECRET: ci-test-secret
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

      - name: Run unit tests
        env:
          DATABASE_URL: postgresql://reserveiq:reserveiq_test@localhost:5432/reserveiq_test
          REDIS_URL: redis://localhost:6379
          NEXTAUTH_SECRET: ci-test-secret
        run: npm run test --if-present

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: reserveiq:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
